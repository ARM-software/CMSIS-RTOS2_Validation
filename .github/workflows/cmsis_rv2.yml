name: RTOS2 Validation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMSIS_PACK_ROOT: ${{ github.workspace }}/.packs
  ARM_UBL_ACTIVATION_CODE: ${{ secrets.ARM_UBL_ACTIVATION_CODE }}
  IAR_LMS_BEARER_TOKEN: ${{ secrets.IAR_LMS_BEARER_TOKEN }}

jobs:
  build-and-run:
    strategy:
      fail-fast: false
      matrix:
        compiler: [AC6, GCC, CLANG, IAR]
        rtos: [RTX5, FreeRTOS]
        device: [CM0plus, CM3, CM4, CM7, CM23, CM33, CM55, CM85]

    runs-on: ubuntu-24.04

    env:
      FVP_EXEC: ${{ fromJSON('{"CM0plus":"FVP_MPS2_Cortex-M0plus","CM3":"FVP_MPS2_Cortex-M3","CM4":"FVP_MPS2_Cortex-M4","CM7":"FVP_MPS2_Cortex-M7","CM23":"FVP_MPS2_Cortex-M23","CM33":"FVP_MPS2_Cortex-M33","CM55":"FVP_MPS2_Cortex-M55","CM85":"FVP_MPS2_Cortex-M85"}')[matrix.device] }}
      IMG_EXT: ${{ fromJSON('{"AC6":"axf","GCC":"elf","CLANG":"elf","IAR":"out"}')[matrix.compiler] }}

    steps:
      - name: Checkout CMSIS-RTOS2_Validation
        uses: actions/checkout@v7
        with:
          path: CMSIS-RTOS2_Validation

      - name: Checkout CMSIS_6
        uses: actions/checkout@v7
        with:
          repository: ARM-software/CMSIS_6
          path: CMSIS_6

      - name: Checkout CMSIS-RTX
        uses: actions/checkout@v7
        with:
          repository: ARM-software/CMSIS-RTX
          path: CMSIS-RTX

      - name: Checkout Cortex_DFP
        uses: actions/checkout@v7
        with:
          repository: ARM-software/Cortex_DFP
          path: Cortex_DFP

      - name: Checkout CMSIS-FreeRTOS
        uses: actions/checkout@v7
        with:
          repository: ARM-software/CMSIS-FreeRTOS
          path: CMSIS-FreeRTOS

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install tools
        uses: ARM-software/cmsis-actions/vcpkg@v1.1
        with:
          config: "CMSIS-RTOS2_Validation/.ci/vcpkg-configuration.json"

      - name: Activate Arm tool license
        uses: ARM-software/cmsis-actions/armlm@v1.1
        with:
          code: ${{ env.ARM_UBL_ACTIVATION_CODE }}

      - name: Register local packs
        run: |
          cpackget init https://www.keil.com/pack/index.pidx
          cpackget rm ARM::CMSIS ARM::Cortex_DFP ARM::CMSIS-RTX ARM::CMSIS-FreeRTOS || echo "Ok"
          cpackget add ./CMSIS_6/ARM.CMSIS.pdsc
          cpackget add ./CMSIS-RTX/ARM.CMSIS-RTX.pdsc
          cpackget add ./CMSIS-FreeRTOS/ARM.CMSIS-FreeRTOS.pdsc
          cpackget add ./Cortex_DFP/ARM.Cortex_DFP.pdsc

      - uses: ammaraskar/gcc-problem-matcher@cb2e3f949c41b7818628f35f8484a9b0acf90cf9
        if: matrix.compiler == 'GCC'

      - name: Initialize CodeQL
        if: matrix.compiler == 'GCC'
        uses: github/codeql-action/init@v4.37.4
        with:
          languages: c-cpp
          queries: security-and-quality

      - name: Build
        working-directory: ./CMSIS-RTOS2_Validation/Project
        run: |
          cbuild Validation.csolution.yml --packs --update-rte \
            --toolchain ${{ matrix.compiler }} \
            --context .${{ matrix.rtos }}+${{ matrix.device }}

      - name: Execute
        if: env.ARM_UBL_ACTIVATION_CODE
        working-directory: ./CMSIS-RTOS2_Validation/Project
        run: |
          ${{ env.FVP_EXEC }} -q --simlimit 100 \
            -f ../Layer/Board/${{ matrix.device }}/fvp_config.txt \
            -a out/Validation/${{ matrix.device }}/${{ matrix.rtos }}/Validation.${{ env.IMG_EXT }} \
            > Validation-${{ matrix.rtos }}-${{ matrix.device }}-${{ matrix.compiler }}.junit
          echo "Test results:"
          cat Validation-${{ matrix.rtos }}-${{ matrix.device }}-${{ matrix.compiler }}.junit

      - name: Deactivate Arm tool license
        if: always()
        run: |
          if [[ -n "${{ env.ARM_UBL_ACTIVATION_CODE }}" ]]; then
            armlm deactivate --code ${{ env.ARM_UBL_ACTIVATION_CODE }}
          else
            armlm deactivate --product KEMDK-COM0
          fi

      - name: Perform CodeQL Analysis
        if: matrix.compiler == 'GCC'
        uses: github/codeql-action/analyze@v4.37.4

      - name: Upload Test Reports
        if: ${{ !cancelled() && env.ARM_UBL_ACTIVATION_CODE }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.rtos }}-${{ matrix.device }}-${{ matrix.compiler }}
          path: ./CMSIS-RTOS2_Validation/Project/*.junit


  publish-test-results:
    needs: [build-and-run]
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Download Test Reports
        if: ${{ env.ARM_UBL_ACTIVATION_CODE }}
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Publish Test Results
        if: ${{ env.ARM_UBL_ACTIVATION_CODE && env.GITHUB_TOKEN }}
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          commit: ${{ github.event.workflow_run.head_sha }}
          event_file: ${{ github.event_path }}
          report_individual_runs: true
          event_name: ${{ github.event.workflow_run.event }}
          files: "artifacts/**/*.junit"
